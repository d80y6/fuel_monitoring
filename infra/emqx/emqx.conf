# =============================================================================
# EMQX broker configuration overrides (mounted at /opt/emqx/etc/custom).
#
# For the full enterprise spec (mTLS X.509, JSON Schema validation on the
# broker, flow limits) use EMQX Enterprise and enable the schema registry for
# the topics defined in /mqtt/*.schema.json.
# =============================================================================

node {
    name = "emqx@127.0.0.1"
    cookie = "fuel_platform_cookie"
}

dashboard {
    # Login is configured at first startup; do NOT pin credentials here.
}

listeners.tcp.default {
    bind = "0.0.0.0:1883"
    max_connections = 1024000
}

authorization {
    no_match = "allow"
    deny_action = "ignore"
}

authorization.sources = [
    {
        type = built_in_database
        enable = true
    }
]