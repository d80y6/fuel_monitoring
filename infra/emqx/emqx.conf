## =============================================================================
## EMQX broker configuration — TRUST BOUNDARY FOR ALL TANK TELEMETRY (G-001)
##
## Mounted read-only over the image's /opt/emqx/etc/emqx.conf.
## Precedence: etc/base.hocon < cluster.hocon < emqx.conf < environment variables.
##
## THE BROKER IS DENY-BY-DEFAULT:
##   * `authentication` uses the built-in database with password auth, so an
##     anonymous MQTT client is rejected at CONNECT. Before this file was
##     actually loaded the broker ran on stock defaults (`authentication = []`,
##     `authorization.no_match = "allow"`), i.e. anyone who could reach port
##     1883 could publish forged measurements.
##   * `authorization.no_match = "deny"` — an authenticated client still gets
##     nothing unless an ACL rule was provisioned for it. Each gateway may use
##     only `fuel/<its-own-mac>/%`; the platform's ingestion service uses the
##     ingestion/iot topics plus `fuel/%`.
##
## Accounts are provisioned by `python -m fmp.scripts.provision_mqtt_accounts`
## (the `mqtt-init` compose service) using the API key bootstrapped from
## /opt/emqx/etc/secrets/api_keys.txt.
##
## PRODUCTION: do not publish 1883/8883/8083/18083 to the internet — keep them
## on a private network or VPN, terminate TLS here (uncomment the ssl listener),
## and rotate the bootstrap key + dashboard password after first provisioning.
## See docs/security/mqtt-and-edge-trust.md.
## =============================================================================

node {
  name = "emqx@127.0.0.1"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
  listeners {
    http.bind = 18083
  }
}

# --- Authentication: built-in database, password based ---------------------
# A single authenticator instance (not a chain): the built-in user database
# checked with salted SHA-256 passwords. Note EMQX's default is
# `authentication = []`, which ALLOWS EVERY LOGIN — the anonymous-access defect.
authentication = {
  enable = true
  backend = "built_in_database"
  mechanism = "password_based"
  user_id_type = "username"
  password_hash_algorithm {
    name = sha256
    salt_position = suffix
  }
}

# --- Authorization: allow only what a provisioned ACL rule grants ---------
authorization {
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = built_in_database
      enable = true
    }
  ]
  cache {
    enable = true
    max_size = 32768
  }
}

# --- API key bootstrap for non-interactive automation ---------------------
api_key {
  bootstrap_file = "/opt/emqx/etc/secrets/api_keys.txt"
}

