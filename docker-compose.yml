# =============================================================================
# Cloud Fuel & Dispensing Platform — full stack
#
#   docker compose up --build
#
# Services: API (:8000), Edge Ingestion (:8001), Celery worker + beat,
#           TimescaleDB, Redis, EMQX MQTT broker (authenticated, deny-by-default),
#           nginx reverse proxy (:80), web frontend (:8080 internal).
#
# Health gating: every application service declares a healthcheck and waits for
# its dependencies to be *healthy*, so a cold start cannot produce the 502 /
# connection-refused window that used to happen while the API was still booting.
# =============================================================================

name: fuel-platform

# One image, built once, shared by every Python service (api, ingest, worker,
# beat, db-init, mqtt-init) — they run identical code and must never drift.
x-app-image: &app-image
  image: fuel-platform-app:local
  build: ./platform
  restart: unless-stopped
  env_file: .env

services:
  db:
    image: timescale/timescaledb:2.11.0-pg14
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fuel_platform}
      POSTGRES_USER: ${POSTGRES_USER:-fuel_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuel_platform}
    volumes:
      - timescale_data:/var/lib/postgresql/data
    # Loopback-only: lets a developer run psql and the test suite against the
    # same database the stack uses. Never reachable from another host.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fuel_platform} -d ${POSTGRES_DB:-fuel_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Loopback-only: lets the local test suite share the running cache instead of
    # starting a second one. Never reachable from another host.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  emqx:
    # Broker trust boundary (G-001): authentication + ACLs are configured in
    # infra/emqx/emqx.conf and accounts are provisioned by the mqtt-init service.
    # For mTLS / X.509 client certificates use EMQX Enterprise.
    image: emqx/emqx:5.8
    restart: unless-stopped
    environment:
      EMQX_NODE__NAME: "emqx@127.0.0.1"
      EMQX_NODE__COOKIE: "${EMQX_NODE_COOKIE:-fuel_platform_cookie}"
      # Dashboard (human) login — independent of the automation API key.
      EMQX_DASHBOARD__DEFAULT_USERNAME: "${EMQX_DASHBOARD_USERNAME:-admin}"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "${EMQX_DASHBOARD_PASSWORD:-}"
    ports:
      # Local/host access only. In production keep 1883/8883/8083/18083 on a
      # private network or a VPN and terminate TLS at the edge (see docs/security).
      - "127.0.0.1:1883:1883"        # MQTT
      - "127.0.0.1:8883:8883"        # MQTTS
      - "127.0.0.1:8083:8083"        # WebSocket
      - "127.0.0.1:18083:18083"      # Dashboard
    volumes:
      # Mounted over the image's real config path: /opt/emqx/etc/custom is
      # ignored by EMQX, which is how the broker ended up on anonymous defaults.
      - ./infra/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      # Mounted only when present: without it the broker starts with no API
      # key, mqtt-init cannot provision device accounts, and telemetry fails
      # closed. That is the intended behaviour for an unconfigured deployment.
      - ./infra/emqx/api_keys.txt:/opt/emqx/etc/api_keys.txt:ro
      - emqx_data:/opt/emqx/data
    healthcheck:
      # `emqx ctl status` shells into the running node; it needs more than the
      # default 10s budget on a loaded host or the broker flaps as unhealthy.
      test: ["CMD-SHELL", "/opt/emqx/bin/emqx ctl status | grep -q 'is started'"]
      interval: 30s
      timeout: 25s
      retries: 5
      start_period: 60s

  mqtt-init:
    # Provisions per-gateway MQTT accounts + ACL rules. Idempotent: re-running is
    # safe and rotates device passwords. Requires EMQX_API_* credentials.
    <<: *app-image
    restart: "no"
    command:
      - bash
      - -c
      - >
        python -m fmp.scripts.provision_mqtt_accounts ||
        echo "WARNING: MQTT account provisioning failed; devices will not be able to connect. Check EMQX_API_* credentials."
    depends_on:
      db:
        condition: service_healthy
      emqx:
        condition: service_healthy

  api:
    <<: *app-image
    command: ["uvicorn", "fmp.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    <<: *app-image
    restart: "no"
    command: ["bash", "-c", "python -m fmp.scripts.init_db && python -m fmp.scripts.backfill_gateways"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingest:
    <<: *app-image
    command: ["uvicorn", "fmp.ingestion.main:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *app-image
    command: ["celery", "-A", "fmp.workers.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Shell form so $HOSTNAME expands; pings every worker node in the cluster
      # (a single dead node among several still counts as a live worker pool).
      test: ["CMD-SHELL", "celery -A fmp.workers.celery_app inspect ping -t 10 | grep -q pong"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 40s

  beat:
    <<: *app-image
    command: ["celery", "-A", "fmp.workers.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_healthy
      ingest:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build: ./web
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  timescale_data:
  redis_data:
  emqx_data: