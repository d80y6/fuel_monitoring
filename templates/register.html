{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4">
    <div class="max-w-md w-full space-y-8">
        <div class="text-center">
            <i data-lucide="user-plus" class="h-12 w-12 text-primary-600 mx-auto mb-4"></i>
            <h2 class="text-2xl font-bold text-gray-900">Registration</h2>
            <p class="mt-2 text-sm text-gray-600">Account registration is managed by your administrator.</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 text-center">
            <p class="text-gray-600 mb-6">Please contact your system administrator to create a new account.</p>
            <a href="{{ url_for('auth.login') }}" class="inline-flex items-center gap-2 px-6 py-3 bg-primary-600 text-white text-sm font-medium rounded-lg hover:bg-primary-700 transition">
                <i data-lucide="log-in" class="h-4 w-4"></i> Back to Login
            </a>
        </div>
    </div>
</div>
<script>lucide.createIcons();</script>
{% endblock %}
