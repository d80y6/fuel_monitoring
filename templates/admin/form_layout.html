{% extends "admin/layout.html" %}

{% block main_content %}
<div class="row">
    <div class="col-md-12">
        <div class="card shadow">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold">{% block form_title %}Form{% endblock %}</h5>
            </div>
            <div class="card-body">
                <form id="{% block form_id %}admin-form{% endblock %}" 
                      method="{% block form_method %}POST{% endblock %}" 
                      action="{% block form_action %}{{ request.path }}{% endblock %}"
                      {% if multipart %}enctype="multipart/form-data"{% endif %}>
                    
                    {% block form_content %}{% endblock %}
                    
                    <div class="row mt-4">
                        <div class="col-md-12">
                            <div class="d-flex justify-content-between">
                                <a href="{% block cancel_url %}javascript:history.back(){% endblock %}" class="btn btn-outline-secondary">
                                    <i class="fas fa-times me-1"></i>Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-1"></i>{% block submit_text %}Save{% endblock %}
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
