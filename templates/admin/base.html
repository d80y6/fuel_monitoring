<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Admin - Fuel Monitor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <script src="{{ url_for('static', filename='vendor/lucide.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/chartjs-adapter-date-fns.bundle.min.js') }}"></script>
    {% block styles %}{% endblock %}
</head>
<body class="h-full bg-gray-50">
    <div class="flex h-full">
        <aside class="w-64 bg-gray-900 text-white flex flex-col">
            <div class="p-4 border-b border-gray-800">
                <a href="{{ url_for('admin.admin_index') }}" class="flex items-center gap-2">
                    <i data-lucide="shield" class="h-6 w-6 text-primary-400"></i>
                    <span class="font-bold">Admin Panel</span>
                </a>
            </div>
            <nav class="flex-1 p-4 space-y-1">
                <a href="{{ url_for('admin.dashboard') }}" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm hover:bg-gray-800 transition">
                    <i data-lucide="layout-dashboard" class="h-4 w-4"></i> Dashboard
                </a>
                <a href="{{ url_for('admin.tanks_index') }}" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm hover:bg-gray-800 transition">
                    <i data-lucide="database" class="h-4 w-4"></i> Tanks
                </a>
                <a href="{{ url_for('admin.sites') }}" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm hover:bg-gray-800 transition">
                    <i data-lucide="map-pin" class="h-4 w-4"></i> Sites
                </a>
                <a href="{{ url_for('admin.companies') }}" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm hover:bg-gray-800 transition">
                    <i data-lucide="building-2" class="h-4 w-4"></i> Companies
                </a>
                <a href="{{ url_for('admin.users') }}" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm hover:bg-gray-800 transition">
                    <i data-lucide="users" class="h-4 w-4"></i> Users
                </a>
                <a href="{{ url_for('admin.alarms_index') }}" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm hover:bg-gray-800 transition">
                    <i data-lucide="bell" class="h-4 w-4"></i> Alarms
                </a>
                <a href="{{ url_for('admin.reports') }}" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm hover:bg-gray-800 transition">
                    <i data-lucide="bar-chart-3" class="h-4 w-4"></i> Reports
                </a>
                <a href="{{ url_for('admin.activity_log') }}" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm hover:bg-gray-800 transition">
                    <i data-lucide="scroll-text" class="h-4 w-4"></i> Activity Log
                </a>
                <a href="{{ url_for('admin.deleted_records') }}" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm hover:bg-gray-800 transition">
                    <i data-lucide="trash-2" class="h-4 w-4"></i> Deleted Records
                </a>
                <a href="{{ url_for('admin.system_settings') }}" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm hover:bg-gray-800 transition">
                    <i data-lucide="settings" class="h-4 w-4"></i> System Settings
                </a>
            </nav>
            <div class="p-4 border-t border-gray-800">
                <a href="{{ url_for('dashboard') }}" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm hover:bg-gray-800 transition">
                    <i data-lucide="arrow-left" class="h-4 w-4"></i> Back to Dashboard
                </a>
            </div>
        </aside>

        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4">
                <h1 class="text-xl font-semibold">{% block page_title %}{% endblock %}</h1>
            </header>
            <main class="flex-1 overflow-y-auto p-6">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script>lucide.createIcons();</script>
    {% block scripts %}{% endblock %}
</body>
</html>
