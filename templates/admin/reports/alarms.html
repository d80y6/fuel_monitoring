{% extends "admin/base.html" %}
{% block title %}Alarm Report - Admin{% endblock %}
{% block page_title %}Alarm Report{% endblock %}
{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    <div id="alarm-chart-container" class="h-96">
        <canvas id="alarmChart"></canvas>
    </div>
    <p class="text-sm text-gray-500 mt-4 text-center">Chart data loads from <code>/api/reports/alarms</code></p>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/chartjs-adapter-date-fns.bundle.min.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    fetch('/api/reports/alarms')
        .then(r => r.json())
        .then(data => {
            if (!data.success) return;
            const ctx = document.getElementById('alarmChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: data.data.map(d => d.level),
                    datasets: [{
                        data: data.data.map(d => d.count),
                        backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        });
});
</script>
{% endblock %}
