{% extends "admin/base.html" %}
{% block title %}Usage Report - Admin{% endblock %}
{% block page_title %}Usage Report{% endblock %}
{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
    <h2 class="text-lg font-semibold text-gray-900 mb-4">Filters</h2>
    <form method="GET" class="grid grid-cols-1 md:grid-cols-5 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
            <input type="date" name="start_date" value="{{ start_date }}" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
            <input type="date" name="end_date" value="{{ end_date }}" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Company</label>
            <select name="company_id" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500">
                <option value="all">All Companies</option>
                {% for c in companies %}
                <option value="{{ c.id }}" {% if company_id|string == c.id|string %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Site</label>
            <select name="site_id" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500">
                <option value="all">All Sites</option>
                {% for s in sites %}
                <option value="{{ s.id }}" {% if site_id|string == s.id|string %}selected{% endif %}>{{ s.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="flex items-end">
            <button type="submit" class="w-full px-4 py-2 bg-primary-600 text-white text-sm font-medium rounded-lg hover:bg-primary-700 transition">Filter</button>
        </div>
    </form>
</div>
<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    <div id="usage-chart-container" class="h-96">
        <canvas id="usageChart"></canvas>
    </div>
    <p class="text-sm text-gray-500 mt-4 text-center">Chart data loads from <code>/api/reports/usage</code></p>
</div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const params = new URLSearchParams(window.location.search);
    fetch('/api/reports/usage?' + params.toString())
        .then(r => r.json())
        .then(data => {
            if (!data.success) return;
            const ctx = document.getElementById('usageChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.data.map(d => d.tank_name),
                    datasets: [{
                        label: 'Usage (L)',
                        data: data.data.map(d => d.total_usage),
                        backgroundColor: '#3b82f6'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        });
});
</script>
{% endblock %}
