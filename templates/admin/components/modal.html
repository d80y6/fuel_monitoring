<div class="modal fade" id="{{ id }}" tabindex="-1" aria-labelledby="{{ id }}Label" aria-hidden="true">
    <div class="modal-dialog {{ size|default('') }}">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="{{ id }}Label">{{ title }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                {{ body|safe }}
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{{ cancel_text|default('Cancel') }}</button>
                {% if form_id %}
                <form id="{{ form_id }}" method="{{ method|default('POST') }}" action="{{ action }}">
                    <button type="submit" class="btn btn-{{ button_color|default('primary') }}">{{ confirm_text|default('Confirm') }}</button>
                </form>
                {% else %}
                <button type="button" id="{{ confirm_id|default('confirm-action') }}" class="btn btn-{{ button_color|default('primary') }}">{{ confirm_text|default('Confirm') }}</button>
                {% endif %}
            </div>
        </div>
    </div>
</div>
