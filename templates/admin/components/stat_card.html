<div class="col-xl-3 col-md-6 mb-4">
    <div class="card border-left-{{ color|default('primary') }} shadow h-100 py-2">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="text-uppercase text-{{ color|default('primary') }} fw-bold">{{ title }}</h6>
                    <h2 class="mb-0 fw-bold" id="{{ id|default('stat-value') }}">{{ value }}</h2>
                </div>
                <i class="fas {{ icon|default('fa-chart-line') }} fa-3x text-{{ color|default('primary') }} opacity-50"></i>
            </div>
            <div class="mt-3">
                <div class="progress" style="height: 8px;">
                    <div class="progress-bar bg-{{ color|default('primary') }}" role="progressbar" style="width: {{ progress|default(100) }}%"></div>
                </div>
            </div>
        </div>
        {% if link %}
        <div class="card-footer d-flex align-items-center justify-content-between bg-light">
            <a href="{{ link }}" class="text-{{ color|default('primary') }} text-decoration-none small">{{ link_text|default('View Details') }}</a>
            <div class="small text-{{ color|default('primary') }}"><i class="fas fa-arrow-right"></i></div>
        </div>
        {% endif %}
    </div>
</div>
