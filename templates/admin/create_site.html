{% extends "admin/base.html" %}

{% block title %}Create Site - Admin - Fuel Tank Monitoring System{% endblock %}

{% block main_content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Create New Site</h1>
    <a href="{{ url_for('admin.admin_sites') }}" class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
        <i data-lucide="arrow-left" class="h-4 w-4 mr-2"></i> Back to Sites
    </a>
</div>

<div class="bg-white shadow rounded-lg">
    <div class="p-6">
        <form action="{{ url_for('admin.admin_create_site') }}" method="POST">
            <div class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Site Name</label>
                    <input type="text" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500" id="name" name="name" required>
                </div>
                <div>
                    <label for="company_id" class="block text-sm font-medium text-gray-700 mb-1">Company</label>
                    <select class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500" id="company_id" name="company_id" required>
                        {% for company in companies %}
                        <option value="{{ company.id }}">{{ company.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="location" class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                    <input type="text" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500" id="location" name="location">
                </div>
                <div>
                    <label for="contact_name" class="block text-sm font-medium text-gray-700 mb-1">Contact Name</label>
                    <input type="text" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500" id="contact_name" name="contact_name">
                </div>
                <div>
                    <label for="contact_email" class="block text-sm font-medium text-gray-700 mb-1">Contact Email</label>
                    <input type="email" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500" id="contact_email" name="contact_email">
                </div>
                <div>
                    <label for="contact_phone" class="block text-sm font-medium text-gray-700 mb-1">Contact Phone</label>
                    <input type="text" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500" id="contact_phone" name="contact_phone">
                </div>
                <div>
                    <label for="address" class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                    <textarea class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500" id="address" name="address" rows="3"></textarea>
                </div>
                <div class="flex items-center">
                    <input type="checkbox" class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded" id="is_active" name="is_active" checked>
                    <label class="ml-2 block text-sm text-gray-900" for="is_active">Active</label>
                </div>
                <div class="pt-4">
                    <button type="submit" class="inline-flex justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">Create Site</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
