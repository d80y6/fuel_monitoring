{% extends "base.html" %}
{% block title %}Tank History - Fuel Monitor{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold">Tank History</h1>
        <div class="flex items-center gap-2">
            <button onclick="exportCSV()" class="px-3 py-1.5 text-sm rounded-lg border border-gray-300 hover:bg-gray-50 transition">Export CSV</button>
        </div>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
        <button onclick="setRange(1)" class="range-btn px-3 py-1.5 text-sm rounded-lg border border-gray-300 hover:bg-primary-50 transition">1h</button>
        <button onclick="setRange(3)" class="range-btn px-3 py-1.5 text-sm rounded-lg border border-gray-300 hover:bg-primary-50 transition">3h</button>
        <button onclick="setRange(6)" class="range-btn px-3 py-1.5 text-sm rounded-lg border border-gray-300 hover:bg-primary-50 transition">6h</button>
        <button onclick="setRange(24)" class="range-btn px-3 py-1.5 text-sm rounded-lg border border-gray-300 bg-primary-50 border-primary-300 font-medium transition">24h</button>
        <button onclick="setRange(168)" class="range-btn px-3 py-1.5 text-sm rounded-lg border border-gray-300 hover:bg-primary-50 transition">7d</button>
        <button onclick="setRange(720)" class="range-btn px-3 py-1.5 text-sm rounded-lg border border-gray-300 hover:bg-primary-50 transition">30d</button>
    </div>
    <div class="bg-white rounded-xl shadow-sm border p-5">
        <h3 class="font-semibold mb-4">Fuel Level</h3>
        <div style="height: 350px;"><canvas id="historyChart"></canvas></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white rounded-xl shadow-sm border p-5">
            <h3 class="font-semibold mb-4">Temperature</h3>
            <div style="height: 200px;"><canvas id="tempChart"></canvas></div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border p-5">
            <h3 class="font-semibold mb-4">Flow Rate</h3>
            <div style="height: 200px;"><canvas id="flowChart"></canvas></div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/chartjs-adapter-date-fns.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/chart-factory.js') }}"></script>
<script>
const TANK_ID = {{ tank.id if tank else 'null' }};
let currentRange = 24;
const historyChart = new Chart(document.getElementById('historyChart').getContext('2d'), { type: 'line', data: { labels: [], datasets: [{ label: 'Level (m)', data: [], borderColor: '#3b82f6', fill: true, backgroundColor: 'rgba(59,130,246,0.1)', tension: 0.3 }] }, options: { responsive: true, maintainAspectRatio: false, scales: { x: { type: 'time', grid: { display: false } }, y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } } }, plugins: { legend: { display: false } } } });
const tempChart = new Chart(document.getElementById('tempChart').getContext('2d'), { type: 'line', data: { labels: [], datasets: [{ label: 'Temp (C)', data: [], borderColor: '#f59e0b', tension: 0.3 }] }, options: { responsive: true, maintainAspectRatio: false, scales: { x: { type: 'time', grid: { display: false } }, y: { grid: { color: 'rgba(0,0,0,0.05)' } } }, plugins: { legend: { display: false } } } });
const flowChart = new Chart(document.getElementById('flowChart').getContext('2d'), { type: 'line', data: { labels: [], datasets: [{ label: 'Flow (L/h)', data: [], borderColor: '#10b981', tension: 0.3 }] }, options: { responsive: true, maintainAspectRatio: false, scales: { x: { type: 'time', grid: { display: false } }, y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } } }, plugins: { legend: { display: false } } } });
async function loadHistory(hours) {
    try {
        const resp = await fetch(`/api/tank/${TANK_ID}/history?hours=${hours}`);
        const data = await resp.json();
        if (!data.measurements) return;
        const labels = data.measurements.map(m => new Date(m.timestamp));
        historyChart.data.labels = labels; historyChart.data.datasets[0].data = data.measurements.map(m => m.level); historyChart.update();
        tempChart.data.labels = labels; tempChart.data.datasets[0].data = data.measurements.map(m => m.temperature); tempChart.update();
        flowChart.data.labels = labels; flowChart.data.datasets[0].data = data.measurements.map(m => m.flow_rate); flowChart.update();
    } catch(e) { console.error('Load failed:', e); }
}
function setRange(hours) { currentRange = hours; document.querySelectorAll('.range-btn').forEach(b => { b.classList.remove('bg-primary-50', 'border-primary-300', 'font-medium'); }); event.target.classList.add('bg-primary-50', 'border-primary-300', 'font-medium'); loadHistory(hours); }
function exportCSV() { window.open(`/api/tank/${TANK_ID}/export?format=csv&hours=${currentRange}`, '_blank'); }
document.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); loadHistory(currentRange); });
</script>
{% endblock %}
