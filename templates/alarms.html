{% extends "base.html" %}
{% block title %}Alarms - Fuel Monitor{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold">Alarms</h1>
        <div class="flex items-center gap-2">
            <button onclick="exportAlarmsCSV()" class="px-3 py-1.5 text-sm rounded-lg border border-gray-300 hover:bg-gray-50 transition">Export CSV</button>
        </div>
    </div>
    <div class="bg-white rounded-xl shadow-sm border p-5">
        <div class="flex flex-wrap items-center gap-4 mb-4">
            <select id="filter-level" class="px-3 py-1.5 text-sm rounded-lg border border-gray-300" onchange="loadAlarms()">
                <option value="">All Levels</option>
                <option value="critical">Critical</option>
                <option value="warning">Warning</option>
                <option value="info">Info</option>
            </select>
            <select id="filter-status" class="px-3 py-1.5 text-sm rounded-lg border border-gray-300" onchange="loadAlarms()">
                <option value="">All Status</option>
                <option value="unacknowledged">Unacknowledged</option>
                <option value="acknowledged">Acknowledged</option>
            </select>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead><tr class="border-b border-gray-200 text-left text-gray-500">
                    <th class="pb-2 font-medium">Tank</th>
                    <th class="pb-2 font-medium">Type</th>
                    <th class="pb-2 font-medium">Level</th>
                    <th class="pb-2 font-medium">Value</th>
                    <th class="pb-2 font-medium">Time</th>
                    <th class="pb-2 font-medium">Status</th>
                </tr></thead>
                <tbody id="alarms-body" class="divide-y divide-gray-100"></tbody>
            </table>
        </div>
        <div id="pagination" class="flex items-center justify-between mt-4 text-sm"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let currentPage = 1;
async function loadAlarms(page = 1) {
    currentPage = page;
    const level = document.getElementById('filter-level').value;
    const status = document.getElementById('filter-status').value;
    let url = `/api/alarms?page=${page}&per_page=20`;
    if (level) url += `&level=${level}`;
    if (status === 'unacknowledged') url += '&acknowledged=0';
    if (status === 'acknowledged') url += '&acknowledged=1';
    try {
        const resp = await fetch(url);
        const data = await resp.json();
        const tbody = document.getElementById('alarms-body');
        tbody.innerHTML = '';
        (data.alarms || []).forEach(a => {
            const badge = a.level === 'critical' ? 'bg-red-100 text-red-800' : a.level === 'warning' ? 'bg-yellow-100 text-yellow-800' : 'bg-blue-100 text-blue-800';
            tbody.innerHTML += `<tr class="hover:bg-gray-50">
                <td class="py-2">${a.tank_name||''}</td>
                <td class="py-2"><span class="px-2 py-0.5 rounded text-xs font-medium ${badge}">${a.type||''}</span></td>
                <td class="py-2 capitalize">${a.level||''}</td>
                <td class="py-2">${a.value||''}</td>
                <td class="py-2 text-gray-500">${a.timestamp ? new Date(a.timestamp).toLocaleString() : ''}</td>
                <td class="py-2">${a.acknowledged ? '<span class="text-green-600">Acked</span>' : '<span class="text-red-600">Active</span>'}</td>
            </tr>`;
        });
        const total = data.total || 0;
        const pages = Math.ceil(total / 20);
        const pag = document.getElementById('pagination');
        pag.innerHTML = `<span class="text-gray-500">Showing ${(page-1)*20+1}-${Math.min(page*20,total)} of ${total}</span><div class="flex gap-2">${page > 1 ? `<button onclick="loadAlarms(${page-1})" class="px-3 py-1 rounded border hover:bg-gray-50">Prev</button>` : ''}${page < pages ? `<button onclick="loadAlarms(${page+1})" class="px-3 py-1 rounded border hover:bg-gray-50">Next</button>` : ''}</div>`;
    } catch(e) { console.error('Load failed:', e); }
}
function exportAlarmsCSV() { window.open('/api/alarms?format=csv', '_blank'); }
document.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); loadAlarms(); });
</script>
{% endblock %}
